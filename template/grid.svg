<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="480" height="480">
  <!--
    The grid an icon is drawn on: 24 units, the icon's ink from 3.75 to
    20.25 (16.5 tall), bodies on the 4.5-19.5 baseline, overhangs out to
    2.25 and 21.75. One stroke of 1.5, round caps and joins. Delete these
    guides when the icon is done: an icon file holds one <path> alone.
  -->
  <rect width="24" height="24" fill="#fff" />
  <g stroke="#e4e4e7" stroke-width="0.04">
    <path d="M1 0v24M2 0v24M3 0v24M4 0v24M5 0v24M6 0v24M7 0v24M8 0v24M9 0v24M10 0v24M11 0v24M12 0v24M13 0v24M14 0v24M15 0v24M16 0v24M17 0v24M18 0v24M19 0v24M20 0v24M21 0v24M22 0v24M23 0v24" />
    <path d="M0 1h24M0 2h24M0 3h24M0 4h24M0 5h24M0 6h24M0 7h24M0 8h24M0 9h24M0 10h24M0 11h24M0 12h24M0 13h24M0 14h24M0 15h24M0 16h24M0 17h24M0 18h24M0 19h24M0 20h24M0 21h24M0 22h24M0 23h24" />
  </g>
  <!-- The ink's top and foot (3.75, 20.25), the baseline (4.5, 19.5), the overhangs (2.25, 21.75), and the middle. -->
  <g stroke-width="0.06" fill="none">
    <path d="M0 3.75h24M0 20.25h24M3.75 0v24M20.25 0v24" stroke="#f43f5e" />
    <path d="M0 4.5h24M0 19.5h24M4.5 0v24M19.5 0v24" stroke="#3b82f6" />
    <path d="M0 2.25h24M0 21.75h24M2.25 0v24M21.75 0v24" stroke="#a1a1aa" stroke-dasharray="0.3 0.3" />
    <path d="M12 0v24M0 12h24" stroke="#a1a1aa" stroke-dasharray="0.15 0.3" />
  </g>
  <!-- Draw here, then keep this path alone, without the guides. -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="" />
</svg>
