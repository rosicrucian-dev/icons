name: Publish

# A tag `vX.Y.Z` publishes both packages at that version to npm, with
# provenance (the packages carry a signed link back to this run). Needs
# either trusted publishing set up for the packages on npmjs.com (no
# secret), or an NPM_TOKEN secret with publish rights on the
# @rosicrucian-dev scope.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The version is the tag's; the packages stay 0.0.0 in git.
      - run: npm version "${GITHUB_REF_NAME#v}" --workspaces --no-git-tag-version
      - run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
